name: Dados de demonstração (homologação)

# Carrega ou remove os dados de demonstração (prefixo DEMO-) no banco
# configurado no segredo PLAN_DATABASE_URL. Somente execução manual.
# Recusado quando a variável PLAN_AMBIENTE do repositório for 'producao'.

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "carregar, remover ou recarregar (remove e carrega de novo) os dados DEMO-"
        required: true
        default: carregar
        type: choice
        options: [carregar, recarregar, remover]

permissions:
  contents: read

jobs:
  dados-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAN_DATABASE_URL: ${{ secrets.PLAN_DATABASE_URL }}
      PLAN_AMBIENTE: ${{ vars.PLAN_AMBIENTE || 'homologacao' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-api.txt
      - name: ${{ inputs.acao }} dados de demonstração
        working-directory: backend
        run: python -m app.demo ${{ inputs.acao }}
